name: Build StoxKart V14 Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stoxkart-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail
          test -f main.py
          test -f buildozer.spec

      - name: Install Linux dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 libffi-dev libssl-dev libltdl-dev libsqlite3-dev

      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "Cython==0.29.36"

      - name: Patch libffi configuration
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch develop \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          python - <<'PY'
          from pathlib import Path
          import re

          recipe = Path(
              "python-for-android/pythonforandroid/recipes/libffi/__init__.py"
          )
          source = recipe.read_text(encoding="utf-8")

          if "--disable-multi-os-directory" not in source:
              patched, count = re.subn(
                  r"('--enable-shared'|\"--enable-shared\")\s*,\s*_env=env\)",
                  lambda m: (
                      f"{m.group(1)}, "
                      "'--disable-multi-os-directory', _env=env)"
                  ),
                  source,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      "Could not patch libffi recipe; stopping build."
                  )
              recipe.write_text(patched, encoding="utf-8")

          print("libffi configuration patch applied.")
          PY

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail

          sed -i '/^[[:space:]]*p4a\.source_dir[[:space:]]*=/d' buildozer.spec
          sed -i "/^\[app\]/a p4a.source_dir = $GITHUB_WORKSPACE/python-for-android" buildozer.spec

          if grep -q '^android.ndk[[:space:]]*=' buildozer.spec; then
            sed -i 's/^android.ndk[[:space:]]*=.*/android.ndk = 28c/' buildozer.spec
          else
            sed -i '/^\[app\]/a android.ndk = 28c' buildozer.spec
          fi

          grep -nE '^(\[app\]|p4a\.source_dir|android\.ndk)' buildozer.spec

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StoxKart-V14-Android-debug-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StoxKart-V14-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14
